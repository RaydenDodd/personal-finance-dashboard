# Source IP is retained by Docker's IPv4 port publishing. A named bridge's
# gateway also permits local health checks and an SSH tunnel on the host.
allow 127.0.0.1;
allow 192.168.0.0/24;
allow 10.192.80.0/24;
allow 172.29.31.1;
deny all;

# OAuth URLs may contain authorization codes; financial API query strings can
# contain account filters. Keep request URIs out of this stack's access logs.
access_log off;
